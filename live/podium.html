<body>
<div id="app"></div>

<script type="module">
import {
  db, ref, get, update, requireTeacher, requirePerm, readParams, isValidCode, fatal, toast,
  esc, standings, plural, fmtNum, HOME_URL, serverNow, avatarInner, avatarInfo, avatarFill, initialsOf,
} from "./live-core.js?v=21";
import { SND, NOTE, reduced } from "./results-fx.js?v=2";

const $ = (id) => document.getElementById(id);
const user = await requireTeacher();
const { code } = readParams("code");
if (!isValidCode(code)) fatal("Невірний код кімнати");

const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) fatal("Кімнату не знайдено — можливо, її вже закрито");
const room = roomSnap.val();
if (room.hostUid && room.hostUid !== user.uid) fatal("Це не ваша кімната");

const totalQ = (room.questions || []).length;
const list = standings(room.players, room.answers);
const showPodium = room.options?.podium !== false;
// «Точність»: на фінальному екрані кількість правильних, а не бали
const acc = room.scoring === "correct";
const val = p => acc ? p.correct : p.score;
const fmtVal = (p, f = 1) => acc ? `${Math.round(p.correct * f)} / ${totalQ}` : fmtNum(Math.round(p.score * f));
const ptsWord = acc ? "правильних" : "балів";
const title = room.testTitle || "Гру завершено";
const meta = `${totalQ} ${plural(totalQ, "питання", "питання", "питань")} · ${list.length} ${plural(list.length, "гравець", "гравці", "гравців")}`;
document.title = `Фінал · ${room.testTitle || code} · QuizFlow Live`;

// Групи за місцем (нічия — кілька гравців з однаковим місцем; місця щільні: 1, 1, 2, 3)
const groups = {};
list.forEach(p => { (groups[p.rank] ||= []).push(p); });
const ranks = showPodium ? Object.keys(groups).map(Number).filter(r => r <= 3).sort((a, b) => a - b) : [];
const top = list[0];
const th = str => esc(str).replace(/[\u00a0\u202f ]/g, '<span class="ts"></span>');
const alpha = g => [...g].sort((x, y) => String(x.nickname).localeCompare(String(y.nickname), "uk"));
const placeOf = r => r === 3 ? "3-є" : r + "-е";
const diffText = (p) => {
  const d = val(top) - val(p);
  if (!d) return "";
  return acc ? `на ${d} ${plural(d, "відповідь", "відповіді", "відповідей")} менше` : `${fmtNum(d)} ${plural(d, "бал", "бали", "балів")} до 1 місця`;
};

// ── Палітри й фігури карток ──
const PAL = {
  3: { fg: "#ffffff", ghost: "rgba(255,255,255,.08)", halo: "rgba(255,255,255,.14)", a: "#ff7a59", b: "#ffd54a", c: "#8fe9ff" },
  2: { fg: "#ffffff", ghost: "rgba(255,255,255,.08)", halo: "rgba(255,255,255,.14)", a: "#3fe0b0", b: "#ffd54a", c: "#ff8fb8" },
  1: { fg: "#0b1033", ghost: "rgba(11,16,51,.07)", halo: "rgba(255,255,255,.38)", a: "#ff6b4a", b: "#ffffff", c: "#3d6bff" },
};
// тип, x, y, розмір, колір, глибина (паралакс), обертання, {w}

    if (crHead) crHead.style.opacity = eO(P(t, TL.cred + 150, TL.cred + 700));
  }
  $("grain").style.transform = `translate(${(t / 42 | 0) % 7 * -11}px,${(t / 42 | 0) % 5 * -8}px)`;
  stage.style.opacity = eO(P(t, 0, 350));
  const skipOn = playing && t < TL.cred - 300; if ($("skip-btn").hidden === skipOn) $("skip-btn").hidden = !skipOn;
}
function loop() {
  if (!playing) return;
  render(now() - t0);
  requestAnimationFrame(loop);
}

// ── Звук ──
const S = {
  whoosh: (ms, dur = .55) => SND.noise(ms, dur, .09, 300, 3400, "bandpass", .8, true),
  tick: (ms, f) => SND.osc("square", f, f, ms, .028, .016),
  pluck: (ms, f, v = .06) => { SND.osc("triangle", f, f * .985, ms, .2, v); SND.osc("sine", f * 2, f * 2, ms, .12, v * .4); },
  counter: (ms, dur) => { const n = Math.floor(dur / 65); for (let i = 0; i < n; i++) S.tick(ms + i * 65, 880 + (i / n) * 900); },
  heart: (ms, v) => { SND.thump(ms, v, 72); SND.thump(ms + 170, v * .7, 64); },
  sparkle: (ms, n) => { const F = [1318.5, 1568, 1760, 2093, 2349]; for (let i = 0; i < n; i++) SND.ping(ms + i * 105 + (i * 37 % 40), F[i % F.length], .03); },
  cymbal: (ms, v) => SND.noise(ms, .9, v, 2800, 9000, "highpass", .7),
};
const B5 = 987.77, D6 = 1174.66, E6 = 1318.5;
function schedule() {
  if (!SND.ok()) { SND.begin(); return; }
  SND.begin();
  CE.forEach(o => {
    const s = o.m.s;
    if (!o.win) {
      S.whoosh(s + 80);
      SND.thump(s + 420, .75, o.rank === 3 ? 120 : 140);
      o.mds.forEach((_, k) => S.pluck(s + 300 + k * 130, 520 + k * 90, .05));
      if (o.solo) S.pluck(s + 330, o.rank === 3 ? NOTE.E5 : NOTE.G5, .07);
      S.counter(s + 700, 1400);
      const nt = o.rank === 3 ? [NOTE.E5, NOTE.G5] : [NOTE.G5, B5, D6];
      nt.forEach((f, k) => SND.ping(s + 760 + k * 120, f, .08));
      SND.ping(s + 2150, o.rank === 3 ? NOTE.C6 : E6, .06);
    } else {
      SND.thump(s + 120, 1.15, 62); S.cymbal(s + 120, .13); S.whoosh(s + 40, .5);
      [NOTE.C4, NOTE.E4, NOTE.G4, NOTE.C5].forEach(f => SND.osc("sawtooth", f, f, s + 260, 1.8, .03));
      SND.chord(s + 300, [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], .075);
      SND.ping(s + 700, NOTE.C6, .1); SND.ping(s + 950, NOTE.G5 * 2, .07);
      S.counter(s + 700, 1600);
      SND.noise(s + 900, 1.3, .035, 1800, 6000, "bandpass", 1.2, true);
      S.sparkle(s + 800, 14);
    }
  });
  if (TL.tens) {
    const [a, b] = TL.tens;
    SND.osc("sine", 55, 55, a, (b - a) / 1000, .13); SND.osc("sine", 82.4, 82.4, a, (b - a) / 1000, .07);
    SND.noise(a + 200, (b - a - 500) / 1000, .1, 400, 6500, "bandpass", .7, true);
    for (let k = 0, x = a + 300; x < b - 380; k++, x += 650) S.heart(x, .4 + k * .12);
  }
  if (TL.cred || !CE.length) {
    const base = TL.cred, F = [NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.A4 * 2];
    crRows.slice(0, 8).forEach((_, k) => SND.ping(base + 250 + k * 90, F[k % F.length], .028));
  }
}
// Кожен показ звучить через власну шину: «Пропустити» чи повтор гасять її разом з усіма вже запланованими нотами
let baseBus = null, runBus = null;
const silence = () => { try { if (runBus && SND.ctx) { const g = runBus; g.gain.cancelScheduledValues(SND.ctx.currentTime); g.gain.setTargetAtTime(0, SND.ctx.currentTime, .03); setTimeout(() => { try { g.disconnect(); } catch {} }, 400); runBus = null; if (baseBus) SND.bus = baseBus; } } catch {} };
const freshBus = () => { try { if (!SND.ctx || !SND.bus) return; baseBus ||= SND.bus; runBus = SND.ctx.createGain(); runBus.gain.value = 1; runBus.connect(baseBus); SND.bus = runBus; } catch {} };

// ── Запуск ──
function run() {
  silence();
  if (reduced() || !list.length) { staticEnd(); return; }
  freshBus();
  t0 = now(); playing = true;
  schedule();
  requestAnimationFrame(loop);
}
function staticEnd() { playing = false; Tel.dataset.phase = "static"; render(TL.cred + 5000); Tel.dataset.phase = "credits"; }
function skip() {
  if (!playing) return;
  silence(); t0 = now() - (TL.cred + 5000); render(TL.cred + 5000);
}
$("skip-btn").addEventListener("click", skip);
$("replay-btn").addEventListener("click", async () => { await SND.ready(150); run(); });
addEventListener("pointermove", e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; mouse.sx += (mouse.x - mouse.sx) * .5; mouse.sy += (mouse.y - mouse.sy) * .5; mouse.last = TT; });
let rzT = 0;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { const t = playing ? now() - t0 : TL.cred + 5000; build(); render(t); }, 120); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && playing) requestAnimationFrame(loop); });

// Звук без жесту користувача браузер не вмикає. Якщо він заблокований (сторінку відкрито напряму, iPhone), не запускаємо
// церемонію мовчки, а просимо торкнутись: цей дотик і вмикає звук, і запускає показ (тож його не можна «проґавити»).
const askToStart = () => new Promise(done => {
  const g = document.createElement("div");
  g.className = "gate";
  g.innerHTML = `<button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><b>Показати результати</b><small>Увімкнеться звук</small></button>`;
  document.body.appendChild(g);
  const b = g.firstElementChild;
  b.focus();
  b.addEventListener("click", async () => { await SND.ready(); g.remove(); done(); }, { once: true });
});

if (!list.length) {
  $("T").insertAdjacentHTML("afterbegin", `<div class="empty">У грі не було учасників</div>`);
  $("T").style.background = "linear-gradient(135deg,#1e3be0,#4a2fe0)";
} else {
  build();
  // ?t=мс — показати один кадр церемонії без звуку й руху (для перевірок і знімків)
  const freeze = new URLSearchParams(location.search).get("t");
  const fontsReady = async () => {
    // шрифти підключаються з відкладенням (media=print → all): чекаємо на справжні, щоб підібрати розміри імен за ними
    const link = [...document.querySelectorAll('link[rel="stylesheet"]')].find(l => /fonts\.googleapis/.test(l.href));
    if (link && link.media === "print") await new Promise(r => { link.addEventListener("load", r, { once: true }); link.addEventListener("error", r, { once: true }); setTimeout(r, 1500); });
    const f = ["800 100px Manrope", "300 100px Manrope", "600 100px Manrope", "700 30px 'Geist Mono'"];
    await Promise.race([Promise.all(f.map(x => document.fonts.load(x, "Аа1").catch(() => {}))), new Promise(r => setTimeout(r, 2000))]);
  };
  document.fonts?.addEventListener?.("loadingdone", () => { if (fontsSettled) { const t = playing ? now() - t0 : (freeze !== null ? Math.max(0, +freeze || 0) : TL.cred + 5000); build(); render(t); } });
  let fontsSettled = false;
  Promise.all([fontsReady(), SND.ready(300)]).then(async ([, audioOk]) => {
    fontsSettled = true;
    build();                                                     // шрифти вже завантажені: імена підбираються за справжніми розмірами
    if (freeze !== null) { playing = false; render(Math.max(0, +freeze || 0)); Tel.dataset.frozen = "1"; return; }
    if (!audioOk && SND.on && !reduced() && cardRanks.length) await askToStart();
    requestAnimationFrame(run);
  });
}

// CSV для Excel: BOM + «;» (українська локаль). На відміну від історії ігор,
// тут є розбір по кожному питанню — кімната ще зберігає всі відповіді.
$("csv-btn").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Місце", "Учасник", "Правильно", "Помилки", "Пропущено", ...(acc ? [] : ["Бали"]), ...Array.from({ length: totalQ }, (_, i) => `П${i + 1}`)];
  const rowsCsv = list.map(p => [p.rank, p.nickname, p.correct, p.answered - p.correct, Math.max(0, totalQ - p.answered), ...(acc ? [] : [p.score]),
    ...Array.from({ length: totalQ }, (_, i) => { const a = room.answers?.[i]?.[p.pid]; return !a ? "—" : a.isCorrect ? (acc ? "✓" : `✓ ${a.points || 0}`) : "✗"; })]);
  const csv = "﻿" + [head, ...rowsCsv].map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${(room.testTitle || "Гра").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60)} — ${new Date().toLocaleDateString("uk-UA")} (${code}).csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV завантажено", "ok");
});

// Кнопки зверху справа ховаються через 4 с без дій і повертаються від руху миші, дотику, клавіші чи фокуса.
// Під курсором і з фокусом усередині вони лишаються. На вузькому екрані кнопки в потоці (CSS не ховає їх).
{
  const acts = document.querySelector(".acts");
  let last = Date.now();
  const wake = () => { last = Date.now(); acts?.classList.remove("idle"); };
  ["pointermove", "pointerdown", "touchstart", "keydown", "wheel", "focusin"].forEach(ev => addEventListener(ev, wake, { passive: true, capture: true }));
  setInterval(() => { if (acts && Date.now() - last > 4000 && !acts.matches(":hover,:focus-within")) acts.classList.add("idle"); }, 500);
}

$("end-btn").addEventListener("click", async () => {
  const btn = $("end-btn"); btn.disabled = true;
  try {
    await update(ref(db, `rooms/${code}`), { status: "finished", finishedAt: serverNow() });
    location.href = HOME_URL;
  } catch (e) { btn.disabled = false; toast("Помилка: " + e.message, "err"); }
});
</script>
