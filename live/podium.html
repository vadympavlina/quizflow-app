<style>
  [hidden]{display:none !important}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0F1844}
  :root{--navy:#0F1844;--navy2:#22338A;--amb:#F59E0B;--amb2:#DC8A00;--blu:#2F5BE0;--blu2:#2449BD;--grn:#0E9F6E;--grn2:#0B8459}
  body{font-family:Manrope,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .T{position:relative;min-height:100vh;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:minmax(260px,1fr) minmax(260px,1fr) auto;grid-template-areas:"w s2" "w s3" "r r";background:var(--navy)}
  .T.np2{grid-template-areas:"w s2" "w s2" "r r"}
  .T.np1,.T.np0{grid-template-columns:1fr;grid-template-rows:minmax(420px,1fr) auto;grid-template-areas:"w" "r"}
  .p{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 40px}
  .p.w{grid-area:w;color:var(--navy);--rc:rgba(15,24,68,.45)}.p.s2{grid-area:s2}.p.s3{grid-area:s3}
  .p .bg{position:absolute;inset:0}.p.w .bg{background:var(--amb)}.p.s2 .bg{background:var(--blu)}.p.s3 .bg{background:var(--grn)}
  .p .num{position:absolute;right:-.03em;bottom:-.17em;font-weight:900;line-height:1;letter-spacing:-.07em;z-index:1;pointer-events:none;transform-origin:70% 60%}
  .p.w .num{font-size:min(760px,92vh);color:var(--amb2);right:10px}.p.s2 .num,.p.s3 .num{font-size:min(380px,46vh)}.p.s2 .num{color:var(--blu2)}.p.s3 .num{color:var(--grn2)}
  .p>.in{position:relative;z-index:2;max-width:100%}
  .p .nm{font-weight:900;letter-spacing:-.045em;line-height:.92;overflow-wrap:anywhere}
  .p.w .nm{font-size:clamp(56px,min(8.2vw,13vh),124px);max-width:92%}.p.s2 .nm,.p.s3 .nm{font-size:clamp(32px,min(3.6vw,6vh),54px);max-width:80%}
  .p.multi .nm{margin-bottom:.08em}.p.w.multi .nm{font-size:clamp(34px,min(4.4vw,7vh),66px)}.p.s2.multi .nm,.p.s3.multi .nm{font-size:clamp(24px,min(2.4vw,4vh),36px)}
  .tie{font-weight:800;font-size:15px;margin-bottom:12px;opacity:.9}
  .p .sc{display:flex;align-items:baseline;gap:12px;margin-top:16px;font-family:"Geist Mono",monospace;font-weight:800;font-variant-numeric:tabular-nums}
  .p.w .sc{font-size:clamp(34px,min(4vw,7vh),56px)}.p.s2 .sc,.p.s3 .sc{font-size:clamp(24px,min(2.2vw,4vh),30px);margin-top:10px}
  .p .sc small{font-family:Manrope,system-ui,sans-serif;font-size:.36em;font-weight:700;opacity:.8}
  .pips{display:flex;gap:4px;margin-top:16px;max-width:min(100%,560px)}.pips i{flex:1;max-width:22px;height:8px;background:currentColor;transform-origin:left}.pips i.x{background:none;box-shadow:inset 0 0 0 2px currentColor;opacity:.55}.pips i.n{opacity:.25}
  .p.s2 .pips i,.p.s3 .pips i{height:6px;max-width:16px}.p.s2 .pips,.p.s3 .pips{margin-top:12px}
  .p .gap{margin-top:10px;font-weight:700;font-size:14.5px;opacity:.88}
  .hdr{position:absolute;left:40px;top:30px;z-index:3;color:var(--navy);font-weight:800;font-size:16px;line-height:1.35;max-width:min(520px,45vw)}.hdr span{font-weight:700;opacity:.7;display:block;font-size:14px}
  .r{grid-area:r;background:var(--navy);padding:22px 40px 26px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:48px;align-content:start}
  .T.np0 .r{grid-template-columns:repeat(2,1fr)}
  .r .row{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.14);font-weight:700;font-size:17px}
  .r .row .f{position:absolute;left:0;bottom:-1px;height:3px;width:var(--w);background:#3E57C4;transform-origin:left}
  .r .row>span{position:relative;min-width:0}.r .k{font-family:"Geist Mono",monospace;color:#8FA2E8}.r .nmr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .s{font-family:"Geist Mono",monospace;font-weight:800}
  .acts{position:absolute;right:20px;top:18px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:56%}
  .acts .btn{font:700 13px Manrope,system-ui,sans-serif;color:#fff;background:rgba(15,24,68,.6);border:0;padding:9px 13px;text-decoration:none;cursor:pointer}
  .acts .btn:hover{background:rgba(15,24,68,.85)}.acts .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .acts .btn.primary{background:#fff;color:var(--navy)}
  .empty{grid-area:w;display:grid;place-items:center;font-weight:800;font-size:22px;color:#C9D3F5;padding:60px 20px;text-align:center}
  @media (max-width:800px){
    .T,.T.np2{display:block;min-height:0}
    .p{min-height:250px;padding:22px 20px}.p.w{min-height:420px}
    .p.w .num{font-size:420px}.p.s2 .num,.p.s3 .num{font-size:280px}
    .p.w .nm{font-size:clamp(44px,13vw,70px)}.p.s2 .nm,.p.s3 .nm{font-size:clamp(30px,9vw,44px);max-width:85%}
    .p.w .sc{font-size:34px}
    .hdr{left:20px;top:20px;max-width:70%}
    .r,.T.np0 .r{grid-template-columns:1fr;padding:18px 20px 10px}
    .acts{position:static;max-width:none;justify-content:center;padding:6px 20px 28px;background:var(--navy)}
  }
</style>
<style id="no-zoom">/* iOS збільшує сторінку, якщо в полі вводу шрифт менше 16px; тут цього не буває */@media (pointer:coarse){input,textarea,select,[contenteditable="true"],[contenteditable=""]{font-size:16px!important}html{touch-action:manipulation;-webkit-text-size-adjust:100%}}</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import {
  db, ref, get, update, requireTeacher, readParams, isValidCode, fatal, toast,
  esc, standings, plural, fmtNum, HOME_URL, serverNow,
} from "./live-core.js?v=9";
import { A, SND, NOTE, split, odo, letters, odometer, fade, flash, shake, rings, cancelAll, finishAll, reduced, POP, EO } from "./results-fx.js?v=1";

const $ = (id) => document.getElementById(id);
const user = await requireTeacher();
const { code } = readParams("code");
if (!isValidCode(code)) fatal("Невірний код кімнати");

const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) fatal("Кімнату не знайдено — можливо, її вже закрито");
const room = roomSnap.val();
if (room.hostUid && room.hostUid !== user.uid) fatal("Це не ваша кімната");

const totalQ = (room.questions || []).length;
const list = standings(room.players, room.answers);
const showPodium = room.options?.podium !== false;
// «Точність»: на фінальному екрані кількість правильних, а не бали
const acc = room.scoring === "correct";
const val = p => acc ? p.correct : p.score;
const shown = p => acc ? `${p.correct} / ${totalQ}` : fmtNum(p.score);
const mx = Math.max(1, ...list.map(val));
const title = room.testTitle || "Гру завершено";
const meta = `${totalQ} ${plural(totalQ, "питання", "питання", "питань")} · ${list.length} ${plural(list.length, "гравець", "гравці", "гравців")}`;
document.title = `Фінал · ${room.testTitle || code} · QuizFlow Live`;

const pips = p => `<div class="pips">${Array.from({ length: totalQ }, (_, i) => {
  const a = room.answers?.[i]?.[p.pid];
  return `<i class="${!a ? "n" : a.isCorrect ? "" : "x"}"></i>`;
}).join("")}</div>`;
const ptsWord = acc ? "" : "балів";
const diffText = (p, top) => {
  const d = val(top) - val(p);
  if (!d) return "";
  return acc ? `на ${d} ${plural(d, "відповідь", "відповіді", "відповідей")} менше` : `${fmtNum(d)} ${plural(d, "бал", "бали", "балів")} до 1 місця`;
};

// Групи за місцем (нічия — кілька гравців з однаковим місцем)
const groups = {};
list.forEach(p => { (groups[p.rank] ||= []).push(p); });
const ranks = showPodium ? Object.keys(groups).map(Number).filter(r => r <= 3).sort((a, b) => a - b) : [];
const top = list[0];
const CLS = ["w", "s2", "s3"];

function panel(rank, i) {
  const g = groups[rank], tied = g.length > 1;
  if (!tied) {
    const p = g[0];
    return `<div class="p ${CLS[i]}"><div class="bg"></div><span class="num">${rank}</span><div class="in">
      <div class="nm">${split(p.nickname)}</div>
      <div class="sc"><span class="odo">${odo(shown(p))}</span><small>${ptsWord}</small></div>
      ${totalQ ? pips(p) : ""}
      <div class="gap">${i === 0 ? (acc ? `${totalQ ? Math.round(p.correct / totalQ * 100) : 0}% правильно` : `${p.correct} з ${totalQ} правильно`) : esc(diffText(p, top))}</div></div></div>`;
  }
  const shownNames = g.slice(0, 6), more = g.length - shownNames.length;
  return `<div class="p ${CLS[i]} multi"><div class="bg"></div><span class="num">${rank}</span><div class="in">
    <div class="tie">Нічия · ${g.length} ${plural(g.length, "гравець", "гравці", "гравців")}</div>
    ${shownNames.map(p => `<div class="nm">${split(p.nickname)}</div>`).join("")}${more > 0 ? `<div class="nm">${split("+" + more)}</div>` : ""}
    <div class="sc"><span class="odo">${odo(shown(g[0]))}</span><small>${ptsWord}</small></div>
    <div class="gap">${i === 0 ? `${g[0].correct} з ${totalQ} правильно` : esc(diffText(g[0], top))}</div></div></div>`;
}

const rest = showPodium ? list.filter(p => p.rank > 3) : list;
const np = ranks.length;
const acts = `<div class="acts">
  <a class="btn" id="history-btn" href="../game-history">Історія ігор</a>
  <a class="btn" id="again-btn" href="#">Зіграти ще раз</a>
  <button class="btn" id="csv-btn" type="button">Завантажити CSV</button>
  <button class="btn" id="snd-btn" type="button"></button>
  <button class="btn" id="replay-btn" type="button">Показати ще раз</button>
  <button class="btn primary" id="end-btn" type="button">Завершити гру</button></div>`;

$("app").innerHTML = `<div class="T np${np}" id="T">
  ${!list.length ? `<div class="empty">У грі не було учасників</div>`
    : np ? ranks.map((r, i) => panel(r, i)).join("")
    : `<div class="p w"><div class="bg"></div><div class="in"><div class="nm">${split(title)}</div><div class="gap">${esc(meta)}</div></div></div>`}
  ${np ? `<div class="hdr">${esc(title)}<span>${esc(meta)}</span></div>` : ""}
  <div class="r" id="rows">${rest.map(p => `<div class="row" style="--w:${val(p) / mx * 100}%"><span class="k">${p.rank}</span><span class="nmr">${esc(p.nickname)}</span><span class="s">${shown(p)}</span><span class="f"></span></div>`).join("")}</div>
  ${acts}</div>`;
if (!rest.length) $("rows").hidden = true;

if (room.testId) $("again-btn").href = `setup?testId=${encodeURIComponent(room.testId)}`;
else $("again-btn").hidden = true;
$("csv-btn").hidden = !list.length;
$("replay-btn").hidden = !list.length;
const sndLabel = () => { $("snd-btn").textContent = SND.on ? "Звук: вкл" : "Звук: вимк"; };
sndLabel();
$("snd-btn").addEventListener("click", () => { SND.toggle(); sndLabel(); });
addEventListener("pointerdown", () => SND.init(), { once: true });
$("replay-btn").addEventListener("click", () => { SND.init(); run(); });

// ── Церемонія: 3 → 2 → 1 ──
function run() {
  cancelAll();
  const Tel = $("T");
  const panels = [...Tel.querySelectorAll(".p")];
  const hdr = Tel.querySelector(".hdr"), rows = [...Tel.querySelectorAll(".r .row")];
  if (reduced() || !panels.length) return;
  SND.begin();
  const times = np === 3 ? [3000, 1650, 350] : np === 2 ? [1700, 350] : [700];
  panels.forEach((p, i) => {
    const t = times[i] ?? 350, win = i === 0 && np > 0, bg = p.querySelector(".bg"), num = p.querySelector(".num"), inn = p.querySelector(".in");
    const cx = win ? "80%" : "84%", cy = win ? "72%" : "70%";
    A(bg, [{ clipPath: `circle(0% at ${cx} ${cy})` }, { clipPath: `circle(150% at ${cx} ${cy})` }], { duration: win ? 900 : 700, delay: t, easing: "cubic-bezier(.7,0,.2,1)" });
    A(num, [{ transform: "scale(2.6) rotate(-8deg)", opacity: 0 }, { transform: "scale(1) rotate(0)", opacity: 1 }], { duration: win ? 650 : 520, delay: t + 220, easing: POP });
    rings(p, cx, cy, t + 520, win ? 4 : 3, win ? 60 : 34);
    A(inn, [{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: t + 300 });
    p.querySelectorAll(".nm").forEach((n, k) => letters(n, t + 420 + k * 120));
    odometer(p.querySelector(".odo"), t + 520, win ? 1900 : 1200);
    A(p.querySelector(".gap"), [{ opacity: 0 }, { opacity: .88 }], { duration: 500, delay: t + 1300 });
    p.querySelectorAll(".pips i").forEach((e, j) => A(e, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 300, delay: t + 900 + j * 45 }));
    if (win) {
      flash(.85, 420, t + 520); shake(Tel, 1.2, 520, t + 520);
      SND.thump(t + 540, 1, 90); SND.chord(t + 540, [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], .07); SND.ping(t + 700, NOTE.C6, .1); SND.ping(t + 950, NOTE.G5 * 2, .06);
    } else {
      shake(Tel, .4, 300, t + 520); SND.thump(t + 540, .7, i === 1 ? 140 : 120); SND.ping(t + 560, i === 1 ? NOTE.E5 : NOTE.D5, .08);
    }
  });
  const after = (times[0] ?? 350) + 1300;
  if (hdr) A(hdr, [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: after });
  rows.forEach((r, i) => {
    A(r, [{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: 500, delay: after + i * 70 });
    A(r.querySelector(".f"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 1100, delay: after + 200 + i * 70, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
  Tel.onclick = e => { if (!e.target.closest(".acts")) finishAll(); };
}
(document.fonts?.ready || Promise.resolve()).then(() => requestAnimationFrame(run));

// CSV для Excel: BOM + «;» (українська локаль). На відміну від історії ігор,
// тут є розбір по кожному питанню — кімната ще зберігає всі відповіді.
$("csv-btn").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Місце", "Учасник", "Правильно", "Помилки", "Пропущено", ...(acc ? [] : ["Бали"]), ...Array.from({ length: totalQ }, (_, i) => `П${i + 1}`)];
  const rowsCsv = list.map(p => [p.rank, p.nickname, p.correct, p.answered - p.correct, Math.max(0, totalQ - p.answered), ...(acc ? [] : [p.score]),
    ...Array.from({ length: totalQ }, (_, i) => { const a = room.answers?.[i]?.[p.pid]; return !a ? "—" : a.isCorrect ? (acc ? "✓" : `✓ ${a.points || 0}`) : "✗"; })]);
  const csv = "\ufeff" + [head, ...rowsCsv].map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${(room.testTitle || "Гра").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60)} — ${new Date().toLocaleDateString("uk-UA")} (${code}).csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV завантажено", "ok");
});

$("end-btn").addEventListener("click", async () => {
  const btn = $("end-btn"); btn.disabled = true;
  try {
    await update(ref(db, `rooms/${code}`), { status: "finished", finishedAt: serverNow() });
    location.href = HOME_URL;
  } catch (e) { btn.disabled = false; toast("Помилка: " + e.message, "err"); }
});
</script>
</body>
