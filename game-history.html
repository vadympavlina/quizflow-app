<style>
#sec-history{
  --ink-900:var(--qf-ink-900);--ink-700:var(--qf-ink-700);--ink-500:var(--qf-ink-500);--ink-400:var(--qf-ink-400);--ink-300:var(--qf-line-strong);
  --line:var(--qf-line);--surface:#F7F9FC;--white:#fff;--accent:var(--qf-blue-strong);--accent-pale:#EFF6FF;
  font-family:'Manrope',system-ui,sans-serif;color:var(--ink-900);
}
#sec-history.on{display:flex;flex-direction:column;gap:18px}
#sec-history [hidden]{display:none!important}
#sec-history button{font-family:inherit}
#sec-history .mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Шапка ── */
.gh-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.gh-title h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
.gh-title p{margin:4px 0 0;color:var(--ink-500);font-size:14px}
.gh-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-700);font:600 13px 'Manrope',sans-serif;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s, color .12s}
.gh-btn:hover{border-color:var(--ink-300);color:var(--ink-900)}
.gh-btn svg{width:14px;height:14px;flex:0 0 auto}
.gh-btn.primary{background:var(--qf-primary-dark);border-color:var(--qf-primary-dark);color:#fff;box-shadow:0 6px 14px -8px rgba(30,58,138,.8)}
.gh-btn.primary:hover{background:var(--qf-primary-hover);border-color:var(--qf-primary-hover);color:#fff}
.gh-btn.ghost{border-color:transparent;background:transparent;color:var(--ink-500)}
.gh-btn.ghost:hover{background:var(--qf-surface-2);color:var(--ink-900)}
.gh-btn.danger{color:var(--qf-danger)}
.gh-btn.danger:hover{background:var(--qf-danger-soft);border-color:var(--qf-danger-line)}
.gh-btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.gh-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-400);cursor:pointer}
.gh-icon:hover{background:var(--qf-surface-2);color:var(--ink-900)}
.gh-icon svg{width:15px;height:15px}

/* ── Тулбар ── */
.gh-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gh-search{position:relative;flex:1;min-width:220px;max-width:380px}
.gh-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none}
.gh-search input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:10px;background:#fff;font:500 14px 'Manrope',sans-serif;color:var(--ink-900);outline:none}
.gh-search input:focus{border-color:var(--accent)}
.gh-seg{display:inline-flex;background:var(--qf-surface-4);border-radius:10px;padding:3px;gap:2px}
.gh-seg button{border:0;background:transparent;padding:7px 11px;border-radius:7px;font:600 13px 'Manrope',sans-serif;color:var(--ink-500);cursor:pointer;white-space:nowrap}
.gh-seg button.on{background:#fff;color:var(--ink-900);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gh-spacer{flex:1}
#sec-history .cd-btn{height:38px;border-radius:10px;border-width:1px;border-color:var(--line);font:600 13px 'Manrope',sans-serif;color:var(--ink-700);max-width:280px}
#sec-history .cd-btn .cd-label{overflow:hidden;text-overflow:ellipsis}
#sec-history .cd-btn:hover,#sec-history .cd-btn.active{border-color:var(--accent);color:var(--accent)}
#sec-history .cd-menu{z-index:60;max-height:340px;overflow-y:auto;min-width:220px}
#sec-history .cd-menu.right{left:auto;right:0}
#sec-history .cd-item{font-family:'Manrope',sans-serif;gap:10px}
#sec-history .cd-item .n{margin-left:auto;font:500 11px 'Geist Mono',monospace;color:var(--ink-400)}
#sec-history .cd-item.cd-active .n{display:none}

/* ── Показники над списком ── */
.gh-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gh-kpi{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;min-width:0}
.gh-kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.gh-kpi .ic svg{width:18px;height:18px}
.gh-kpi .ic.b{background:#EAF0FF;color:#2D5BE3}.gh-kpi .ic.v{background:#F3EEFF;color:#7C3AED}.gh-kpi .ic.g{background:#DCFCE7;color:#15803D}.gh-kpi .ic.a{background:#FEF3C7;color:#B45309}
.gh-kpi .t{min-width:0}
.gh-kpi .v{font:800 22px 'Geist Mono',monospace;letter-spacing:-.03em;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-kpi .v.sm{font-size:15px;letter-spacing:-.01em;font-family:'Manrope',sans-serif}
.gh-kpi .l{font-size:12px;color:var(--ink-500);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Список ігор ── */
.gh-list{display:flex;flex-direction:column;gap:12px}
.gh-group{font:700 11px 'Manrope',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);padding:10px 4px 0;display:flex;justify-content:space-between}
.gh-group:first-child{padding-top:0}
.gh-group .n{font:500 11px 'Geist Mono',monospace;text-transform:none;letter-spacing:0}
.gh-game{display:flex;flex-direction:column;gap:14px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;transition:border-color .15s,box-shadow .15s;content-visibility:auto;contain-intrinsic-size:auto 170px}
.gh-game:hover{border-color:var(--ink-300);box-shadow:0 14px 32px -24px rgba(30,58,138,.5)}
.gh-game.empty-game{opacity:.78}
.gh-head{display:flex;align-items:center;gap:14px;min-width:0}
.gh-tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font:800 12px 'Geist Mono',monospace;letter-spacing:-.02em;position:relative;overflow:hidden;flex:0 0 auto}
.gh-tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.3),transparent 60%)}
.gh-main{min-width:0;flex:1}
.gh-name{font-weight:800;font-size:16px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-900);text-align:left;max-width:100%;display:block}
.gh-name:hover{color:var(--accent)}
.gh-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--ink-500)}
.gh-meta .code{font-family:'Geist Mono',monospace;color:var(--ink-700);font-weight:600}
.gh-meta .dot{color:var(--ink-300)}
.gh-mode{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:999px;font:700 11.5px 'Manrope',sans-serif;white-space:nowrap;flex:0 0 auto}
.gh-mode svg{width:12px;height:12px}
.gh-mode.speed{background:#FEF3C7;color:#92400E}
.gh-mode.acc{background:#DCFCE7;color:#166534}
.gh-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}

.gh-body{display:grid;grid-template-columns:repeat(3,auto) minmax(150px,1fr) minmax(210px,1.1fr);gap:26px;align-items:center;padding-top:14px;border-top:1px solid var(--qf-line-soft)}
.gm{min-width:0}
.gm .v{font:800 20px 'Geist Mono',monospace;letter-spacing:-.03em;color:var(--ink-900);white-space:nowrap}
.gm .v small{font:600 12px 'Manrope',sans-serif;letter-spacing:0;color:var(--ink-500);margin-left:3px}
.gm .l{font:700 11px 'Manrope',sans-serif;color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.gm .bar{display:block;height:5px;border-radius:3px;background:var(--qf-line-soft);overflow:hidden;margin-top:6px;width:100%;min-width:64px}
.gm .bar i{display:block;height:100%;border-radius:3px}

/* Розподіл результатів: суцільна смуга з частками й підписи під нею */
.gh-spread .sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--qf-line-soft)}
.gh-spread .sbar i{display:block;height:100%;min-width:4px}
.gh-spread .leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font:600 11.5px 'Geist Mono',monospace;color:var(--ink-500)}
.gh-spread .leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.gh-spread .leg b{width:8px;height:8px;border-radius:50%;display:block}
.gh-spread .cap{font:700 11px 'Manrope',sans-serif;color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.gh-hist{display:flex;align-items:flex-end;gap:3px;height:34px}
.gh-hist i{flex:1;background:#C7D6F5;border-radius:3px 3px 0 0;min-height:3px}
.gh-hist i.hi{background:var(--qf-blue-strong)}

.gh-lead{display:flex;flex-direction:column;gap:5px;min-width:0}
.gh-lead .cap{font:700 11px 'Manrope',sans-serif;color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.gh-pr{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.gh-pr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink-700)}
.gh-pr .tie{font:600 11px 'Geist Mono',monospace;color:var(--ink-400);flex:0 0 auto}
.gh-pr .pt{font:700 12.5px 'Geist Mono',monospace;color:var(--accent);flex:0 0 auto}
.gh-pr .pt.g{color:#15803D}
.gh-pr .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--qf-line-soft);color:var(--ink-500);font:700 10.5px 'Geist Mono',monospace;flex:0 0 auto}
.gh-noresults{font-size:13px;color:var(--ink-400);font-style:italic;grid-column:1/-1}
/* Медалі — CSS замість емодзі */
.medal{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:0 0 auto;font:800 11px "Geist Mono",monospace;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.medal.r1{background:linear-gradient(135deg,#FCD34D,#D97706)}
.medal.r2{background:linear-gradient(135deg,#E5E7EB,#9CA3AF)}
.medal.r3{background:linear-gradient(135deg,#FDBA74,#C2410C)}

.gh-more{align-self:center;margin-top:6px}
.gh-empty{text-align:center;padding:56px 20px;color:var(--ink-500);background:#fff;border:1px dashed var(--ink-300);border-radius:18px}
.gh-empty .i{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:var(--qf-surface-2);display:grid;place-items:center;color:var(--qf-primary-dark)}
.gh-empty h3{font-size:16px;font-weight:800;color:var(--ink-900);margin:0 0 4px}
.gh-empty p{font-size:13px;margin:0 0 16px}
.gh-skel{height:150px;border-radius:18px;background:linear-gradient(90deg,var(--qf-surface-2),#F7F9FC,var(--qf-surface-2));background-size:200% 100%;animation:ghsk 1.2s infinite}
@keyframes ghsk{to{background-position:-200% 0}}

/* ── Плаваюче меню гри ── */
.gh-menu{position:fixed;z-index:300;min-width:220px;background:#fff;border:1px solid var(--qf-line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(11,20,55,.28);padding:6px;font-family:'Manrope',sans-serif}
.gh-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;font:500 14px 'Manrope',sans-serif;color:var(--qf-ink-700);cursor:pointer;text-align:left}
.gh-menu button svg{width:15px;height:15px;color:var(--qf-ink-500)}
.gh-menu button:hover,.gh-menu button:focus-visible{background:var(--qf-surface-4);outline:none}
.gh-menu button.d,.gh-menu button.d svg{color:var(--qf-danger)}
.gh-menu button.d:hover{background:var(--qf-danger-soft)}
.gh-menu hr{border:0;height:1px;background:var(--qf-line);margin:5px 4px}

/* ── Модалка результатів ── */
#m-res .mb{max-width:880px;padding:0;display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.res-head{padding:22px 24px 18px;border-bottom:1px solid var(--qf-line);padding-right:64px;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#F8FAFF,#fff)}
.res-tt{min-width:0}
.res-ico{flex:0 0 auto;width:48px;height:48px;border-radius:15px;display:grid;place-items:center}
.res-ico.speed{background:#FEF3C7;color:#B45309}.res-ico.acc{background:#DCFCE7;color:#15803D}
.res-head h3{margin:0;font:800 21px 'Manrope',sans-serif;letter-spacing:-.015em;color:var(--qf-ink-900);overflow-wrap:anywhere}
.res-head p{margin:7px 0 0;font-size:13px;color:var(--qf-ink-500);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-head .chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--qf-line-soft);color:var(--qf-ink-700);font:600 12px 'Manrope',sans-serif}
.res-head .chip.code{font-family:'Geist Mono',monospace}
.res-head .mcl{position:absolute;top:18px;right:18px;float:none;margin:0}
.res-tools .gh-search{flex:1 1 220px}
.res-tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--qf-line);position:sticky;top:0;z-index:3;background:#fff}
#rtab{display:flex;gap:26px;background:none;padding:0;border-radius:0}
#rtab button{padding:14px 2px 13px;border-radius:0;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;background:none!important;box-shadow:none!important}
#rtab button.on{color:var(--qf-primary);border-bottom-color:var(--qf-primary)}
.res-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--qf-line)}
.res-tools .gh-search{max-width:none}
#res-csv{margin-left:auto}
.res-count{font:600 12.5px 'Manrope',sans-serif;color:var(--qf-ink-500);white-space:nowrap}
.res-scroll{overflow-y:auto;flex:1;min-height:0}
.res-body{min-height:120px}
.res-table{width:100%;border-collapse:separate;border-spacing:0;font-family:'Manrope',sans-serif}
.res-table th{position:sticky;top:0;z-index:1;background:var(--qf-surface-3);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--qf-ink-400);text-align:left;padding:9px 12px;border-bottom:1px solid var(--qf-line)}
.res-table td{padding:11px 12px;border-bottom:1px solid var(--qf-line-soft);font-size:14px;color:var(--qf-ink-700);vertical-align:middle}
.res-table tr:last-child td{border-bottom:0}
.res-table tbody tr:hover td{background:#F7F9FC}
.res-table .r1 td{background:#FFFBEB}.res-table .r2 td{background:#F8FAFC}.res-table .r3 td{background:#FFF7ED}
.res-table .r1 td:first-child{box-shadow:inset 3px 0 0 #F59E0B}.res-table .r2 td:first-child{box-shadow:inset 3px 0 0 #9CA3AF}.res-table .r3 td:first-child{box-shadow:inset 3px 0 0 #EA580C}
.res-table tbody tr:hover td{background:#F4F7FF}
.res-table th:first-child,.res-table td:first-child{padding-left:24px;width:56px}
.res-table th:last-child,.res-table td:last-child{padding-right:24px;text-align:right}
.res-rank{font:700 13px 'Geist Mono',monospace;color:var(--qf-ink-400)}
.res-rank .medal{width:26px;height:26px;font-size:12.5px}
.res-who{display:flex;align-items:center;gap:10px;min-width:0}
.res-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px 'Manrope',sans-serif;flex:0 0 auto}
.res-nm{font-weight:700;color:var(--qf-ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.gv{display:inline-flex;gap:2px;padding:3px;background:var(--qf-line-soft);border-radius:10px}
.gv button{border:0;background:transparent;font:700 12px 'Manrope',sans-serif;color:var(--qf-ink-500);padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.gv button:hover{color:var(--qf-ink-700)}.gv button.on{background:#fff;color:var(--qf-primary);box-shadow:0 1px 3px rgba(20,30,70,.14)}
.gv button:focus-visible{outline:2px solid var(--qf-primary);outline-offset:1px}
.res-gr{display:inline-grid;place-items:center;min-width:38px;height:30px;padding:0 9px;border-radius:10px;font:800 14px 'Geist Mono',monospace}
.res-gr.t-hi{background:var(--qf-success-soft);color:#166534}.res-gr.t-mid{background:#DBEAFE;color:var(--qf-primary-hover)}.res-gr.t-lo{background:var(--qf-warn-soft);color:var(--qf-warn-dark)}.res-gr.t-no{background:var(--qf-danger-soft);color:#991B1B}
.res-table th.c-gr,.res-table td.c-gr{text-align:center}
.res-acc{display:flex;align-items:center;gap:10px;min-width:150px}
.res-acc .bar{flex:1;height:8px;border-radius:4px;background:var(--qf-line-soft);overflow:hidden;max-width:150px}
.res-acc .bar i{display:block;height:100%;border-radius:3px}
.res-acc .t{font:600 12px 'Geist Mono',monospace;color:var(--qf-ink-500);white-space:nowrap}
.res-main{font:800 16px 'Geist Mono',monospace;letter-spacing:-.02em;white-space:nowrap}
.res-main.pts{color:var(--qf-blue-strong)}.res-main.ok{color:#15803D}
.res-main small{font:600 12px 'Manrope',sans-serif;letter-spacing:0;color:var(--qf-ink-500);margin-left:3px}
.res-more{display:block;margin:12px auto}
.res-none{padding:40px;text-align:center;color:var(--qf-ink-400);font-size:13px}
mark.hl{background:#FEF08A;color:inherit;border-radius:2px;padding:0 1px}
/* Питання: наскільки легкі й складні */
.qs-list{display:flex;flex-direction:column}
.qs-row{display:grid;grid-template-columns:34px minmax(0,1fr) 150px 74px;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--qf-line-soft)}
.qs-row:last-child{border-bottom:0}
.qs-n{font:700 12px 'Geist Mono',monospace;color:var(--qf-ink-400)}

<script type="module">
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const { initApp, appReady } = await import("./shared/app.js?v=48");
await initApp("history", { skipData: true });

const db = getDatabase();
const uid = window._user?.id || window._uid || "";
const $ = id => document.getElementById(id);
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);
const fmt = n => Number(n || 0).toLocaleString("uk");
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
const nPlayers = n => `${fmt(n)} ${plural(n, "гравець", "гравці", "гравців")}`;
const toMs = ts => !ts ? 0 : ts < 1e11 ? ts * 1000 : ts;
const DAY = 864e5;

function fmtDate(ts, withYear = true){
  ts = toMs(ts); if (!ts) return "—";
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
  const diff = (now - d) / 1000;
  if (diff < 60) return "щойно";
  if (diff < 3600) return `${Math.floor(diff / 60)} хв тому`;
  if (d.toDateString() === now.toDateString()) return `сьогодні, ${time}`;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return `вчора, ${time}`;
  const opts = { day: "numeric", month: "short" };
  if (withYear && d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return `${d.toLocaleDateString("uk-UA", opts)}, ${time}`;
}
function groupLabel(ts){
  const d = new Date(toMs(ts)), now = new Date();
  const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(now) - start(d)) / DAY);
  if (days <= 0) return "Сьогодні";
  if (days === 1) return "Вчора";
  if (days < 7) return "Цього тижня";
  const m = d.toLocaleDateString("uk-UA", { month: "long", year: d.getFullYear() !== now.getFullYear() ? "numeric" : undefined });
  return m.charAt(0).toUpperCase() + m.slice(1);
}

// Колір плитки — стабільний для тесту (одна й та сама гра = один колір)
const PAL = ["#2563EB","#7C3AED","#0D9488","#EA580C","#DB2777","#0891B2","#4F46E5","#16A34A"];
const colorFor = s => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PAL[h % PAL.length]; };
const abbr = t => { const w = String(t || "").match(/[\p{L}\p{N}]+/gu) || ["?"]; return (w.length === 1 ? w[0].slice(0, 3) : w.slice(0, 3).map(x => x[0]).join("")).toUpperCase(); };
const initials = n => { const p = String(n || "").trim().split(/\s+/).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : (p[0] || "?").slice(0, 2)).toUpperCase(); };
const medal = r => `<span class="medal r${r}" aria-label="${r} місце">${r}</span>`;

// ─── Оцінка за місцем ──────────────────────────────────────────────────
// 12-бальна шкала за місцем у грі: 1 місце = 12, 2 = 11, 3 = 10 … Місця йдуть підряд без пропусків (однаковий результат = однакове місце), нижче 1 не опускається.
const gradeOf = r => Math.max(1, 13 - r.rank);
const gradeTone = n => n == null ? "t-no" : n >= 10 ? "t-hi" : n >= 7 ? "t-mid" : n >= 4 ? "t-lo" : "t-no";

// ─── Режими підрахунку ─────────────────────────────────────────────────
// speed — «за балами» (500–1000 за правильну залежно від швидкості); acc — «за правильними» (1000 за правильну, швидкість не рахується).
// У старих записах поля scoring немає, тож режим вгадуємо за балами.
const MODE = { speed: "За балами", acc: "За правильними" };
const MODE_ICON = { speed: '<path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>', acc: '<polyline points="20 6 9 17 4 12"/>' };
const modeBadge = m => `<span class="gh-mode ${m}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${MODE_ICON[m]}</svg>${MODE[m]}</span>`;
function modeOf(sc, rows){
  if (sc === "speed") return "speed";
  if (sc === "correct") return "acc";
  if (!rows.some(r => r.score > 0)) return "acc";
  return rows.every(r => r.score % 1000 === 0 && (r.correct == null || r.score === r.correct * 1000)) ? "acc" : "speed";
}
// Групи за часткою від максимуму: колір і поріг. Для балів пороги нижчі — повні 100% майже недосяжні (швидкість).
const BK = {
  speed: [{ c: "#16A34A", min: .75 }, { c: "#2563EB", min: .5 }, { c: "#F59E0B", min: .25 }, { c: "#DC2626", min: 0 }],
  acc:   [{ c: "#16A34A", min: .9 },  { c: "#2563EB", min: .7 }, { c: "#F59E0B", min: .4 },  { c: "#DC2626", min: 0 }],
};
const bkLabel = (m, i) => { const a = BK[m], lo = Math.round(a[i].min * 100); return i === 0 ? `${lo}%+` : i === a.length - 1 ? `до ${Math.round(a[i - 1].min * 100)}%` : `${lo}–${Math.round(a[i - 1].min * 100) - 1}%`; };
const accCol = p => p >= 70 ? "#16A34A" : p >= 40 ? "#2563EB" : "#DC2626";
const KI = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const f1 = x => Number(x).toLocaleString("uk", { maximumFractionDigits: 1 });

// ─── Підготовка даних: один раз на гру, а не при кожному рендері ────────
function prep(code, g){
  const rows = (Array.isArray(g.results) ? g.results : Object.values(g.results || {}))
    .filter(Boolean).map(r => ({ nickname: r.nickname || "—", score: Number(r.score) || 0, correct: r.correct == null ? null : Number(r.correct) }));
  const mode = modeOf(g.scoring, rows);
  if (mode === "acc") rows.forEach(r => { if (r.correct == null) r.correct = Math.round(r.score / 1000); });
  const results = rows.sort((a, b) => b.score - a.score || (b.correct ?? 0) - (a.correct ?? 0) || a.nickname.localeCompare(b.nickname, "uk"));
  let rank = 0, prev = null;
  results.forEach(r => { if (r.score !== prev){ rank++; prev = r.score; } r.rank = rank; });
  const n = results.length;
  const sum = results.reduce((a, r) => a + r.score, 0);
  const qc = Number(g.questionCount) || 0;
  const max = n ? results[0].score : 0;
  const withCorrect = qc ? results.filter(r => r.correct != null) : [];
  const corrSum = withCorrect.reduce((s, r) => s + r.correct, 0);
  const acc = withCorrect.length ? Math.round(corrSum / (withCorrect.length * qc) * 100) : null;
  const avgCorrect = withCorrect.length ? corrSum / withCorrect.length : null;
  const perfect = qc ? results.filter(r => r.correct != null && r.correct >= qc).length : 0;
  // Частка від максимуму для груп розподілу
  const buckets = [0, 0, 0, 0];
  results.forEach(r => {
    r.share = mode === "acc" ? (qc ? (r.correct ?? 0) / qc : max ? r.score / max : 0) : (qc ? Math.min(1, r.score / (qc * 1000)) : max ? r.score / max : 0);
    buckets[BK[mode].findIndex(b => r.share + 1e-9 >= b.min)]++;
  });
  const qstats = (Array.isArray(g.questionStats) ? g.questionStats : Object.values(g.questionStats || {})).filter(Boolean)
    .map(q => ({ t: String(q.t || ""), c: Number(q.c) || 0, n: Number(q.n) || 0 }));
  return {
    code, raw: g, results, mode, n: n || Number(g.playerCount) || 0, hasResults: n > 0,
    title: g.testTitle || "Без назви", testId: g.testId || "", playedAt: toMs(g.playedAt), qc,
    avg: n ? Math.round(sum / n) : 0, median: n ? results[Math.floor(n / 2)].score : 0, max, acc, avgCorrect, perfect, buckets, qstats,
    medianCorrect: n && results[0].correct != null ? results[Math.floor(n / 2)].correct : null,
    search: (g.testTitle || "").toLowerCase() + " " + code + " " + results.map(r => r.nickname.toLowerCase()).join(" "),
  };
}

// Смуга розподілу учасників за результатом + підписи з кількістю
function spreadHtml(g){
  const segs = g.buckets.map((c, i) => c ? `<i style="flex:${c};background:${BK[g.mode][i].c}" title="${bkLabel(g.mode, i)}: ${c}"></i>` : "").join("");
  const leg = g.buckets.map((c, i) => c ? `<span><b style="background:${BK[g.mode][i].c}"></b>${bkLabel(g.mode, i)} · ${c}</span>` : "").join("");
  return `<div class="sbar" role="img" aria-label="Розподіл учасників за результатом">${segs}</div><div class="leg">${leg}</div>`;
}
const spreadCap = g => g.mode === "acc" ? "Скільки відповіли правильно" : "Скільки балів від максимуму";
const valOf = (g, r) => g.mode === "acc" ? (g.qc ? `${r.correct}/${g.qc}` : `${r.correct}`) : fmt(r.score);

// ─── Фільтри й рендер ──────────────────────────────────────────────────
function filtered(){
  const now = Date.now();
  let list = games;
  if (ui.period !== "all") list = list.filter(g => now - g.playedAt <= Number(ui.period) * DAY);
  if (ui.mode !== "all") list = list.filter(g => g.mode === ui.mode);
  if (ui.test) list = list.filter(g => (g.testId || g.title) === ui.test);
  if (ui.q){ const ws = ui.q.toLowerCase().split(/\s+/).filter(Boolean); list = list.filter(g => ws.every(w => g.search.includes(w))); }
  const by = {
    new: (a, b) => b.playedAt - a.playedAt,
    old: (a, b) => a.playedAt - b.playedAt,
    players: (a, b) => b.n - a.n || b.playedAt - a.playedAt,
    acc: (a, b) => (b.acc ?? -1) - (a.acc ?? -1) || b.playedAt - a.playedAt,
  }[ui.sort];
  return [...list].sort(by);
}

function renderKpis(list){

  const sp = list.filter(g => g.mode === "speed").length, ac = list.length - sp;
  const k = (cls, ic, v, l) => `<div class="gh-kpi"><span class="ic ${cls}" aria-hidden="true">${KI(ic)}</span><div class="t"><div class="v">${v}</div><div class="l">${l}</div></div></div>`;

    k("g", '<circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9.5"/>', acc != null ? acc + "%" : "—", "середня точність") +

function gameRow(g){
  const col = colorFor(g.testId || g.title);
  const gm = (v, l, bar) => `<div class="gm"><div class="v">${v}</div><div class="l">${l}</div>${bar != null ? `<span class="bar"><i style="width:${bar}%;background:${accCol(bar)}"></i></span>` : ""}</div>`;
  let body;
  if (!g.hasResults){
    body = `<span class="gh-noresults">Ніхто не відповідав</span>`;
  } else {
    const ranks = [1, 2, 3].map(r => g.results.filter(x => x.rank === r)).filter(a => a.length);
    const lead = ranks.map(grp => `<div class="gh-pr">${medal(grp[0].rank)}<span class="nm" title="${esc(grp.map(x => x.nickname).join(", "))}">${esc(grp[0].nickname)}</span>${grp.length > 1 ? `<span class="tie">+${grp.length - 1}</span>` : ""}<span class="pt${g.mode === "acc" ? " g" : ""}">${valOf(g, grp[0])}</span></div>`).join("");
    const m2 = g.mode === "acc"
      ? gm(g.avgCorrect != null ? `${f1(g.avgCorrect)}<small>${g.qc ? "з " + g.qc : ""}</small>` : "—", "сер. правильних", g.acc)
      : gm(fmt(g.avg), "сер. бал");
    const m3 = g.mode === "acc"
      ? (g.qc ? gm(`${g.perfect}<small>з ${g.n}</small>`, "без помилок") : gm(fmt(g.results[0].correct), "найкращий"))
      : gm(g.acc != null ? g.acc + "%" : "—", "точність", g.acc);
    body = gm(fmt(g.n), plural(g.n, "гравець", "гравці", "гравців")) + m2 + m3 +
      `<div class="gh-spread"><div class="cap">${spreadCap(g)}</div>${spreadHtml(g)}</div>` +
      `<div class="gh-lead"><div class="cap">Лідери</div>${lead}</div>`;
  }
  return `<article class="gh-game${g.hasResults ? "" : " empty-game"}" data-code="${esc(g.code)}" data-mode="${g.mode}">

      <div class="gh-tile" style="background:${col}">${esc(abbr(g.title))}</div>
      <div class="gh-main">
        <button class="gh-name" data-act="${g.hasResults ? "open" : ""}" data-code="${esc(g.code)}" title="${esc(g.title)}">${esc(g.title)}</button>
        <div class="gh-meta">${modeBadge(g.mode)}<span>${fmtDate(g.playedAt)}</span><span class="dot">·</span><span class="code">${esc(g.code)}</span>${g.qc ? `<span class="dot">·</span><span>${g.qc} ${plural(g.qc, "питання", "питання", "питань")}</span>` : ""}</div>
      </div>
      <div class="gh-actions">
        ${g.hasResults ? `<button class="gh-btn sm" data-act="open" data-code="${esc(g.code)}">Результати</button>` : ""}
        <button class="gh-icon" data-act="menu" data-code="${esc(g.code)}" aria-haspopup="menu" aria-label="Дії з грою"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      </div>
    </div>
    ${g.hasResults ? `<div class="gh-body">${body}</div>` : `<div class="gh-body" style="grid-template-columns:1fr">${body}</div>`}
  </article>`;
}

function syncTabs(){

function renderQs(){
  const g = resGame; if (!g) return;
  const qs = g.qstats.map((q, i) => ({ ...q, i, p: q.n ? q.c / q.n : 0 }));
  if (qOrder === "hard") qs.sort((a, b) => a.p - b.p || a.i - b.i);
  $("qs-list").innerHTML = qs.map(q => {

  }).join("");
}
function hl(text, q){
  const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q); if (i < 0) return t;
  return esc(text.slice(0, i)) + `<mark class="hl">${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}
document.addEventListener("click", e => {
  const t = e.target.closest("#rtab [data-tab]"); if (t){ resTab = t.dataset.tab; syncTabs(); return; }
  const o = e.target.closest("#qsort [data-qs]"); if (o){ qOrder = o.dataset.qs; syncTabs(); renderQs(); }
});
function renderResults(){
  const g = resGame; if (!g) return;
  const acc = g.mode === "acc";
  const q = $("res-search").value.trim().toLowerCase();
  const list = q ? g.results.filter(r => r.nickname.toLowerCase().includes(q)) : g.results;
  $("res-count").textContent = q ? `${list.length} з ${g.results.length}` : nPlayers(g.results.length);
  if (!list.length){ $("res-body").innerHTML = `<div class="res-none">${q ? "Нікого не знайдено" : "Немає результатів"}</div>`; return; }
  const shown = list.slice(0, resLimit);
  const hasC = g.results.some(r => r.correct != null);
  const showBar = g.qc > 0 && hasC;
  const head = `<th>#</th><th>Учасник</th>` +
    (acc ? (showBar ? `<th class="c-acc">Точність</th>` : "") : (showBar ? `<th class="c-acc">Правильно</th>` : "")) +
    `<th class="c-gr" title="12-бальна шкала за місцем у грі: 1 місце — 12, 2 — 11, 3 — 10 і так далі">Оцінка</th><th>${acc ? "Правильно" : "Бали"}</th>`;
  const rowHtml = r => {
    const pct = showBar && r.correct != null ? Math.round(r.correct / g.qc * 100) : null;
    const bar = pct == null ? `<span class="res-acc"><span class="t">—</span></span>`
      : `<div class="res-acc"><span class="bar"><i style="width:${pct}%;background:${accCol(pct)}"></i></span><span class="t" style="color:${accCol(pct)}">${acc ? pct + "%" : r.correct + "/" + g.qc}</span></div>`;
    const main = acc ? `<span class="res-main ok">${r.correct ?? "—"}${g.qc ? `<small>/ ${g.qc}</small>` : ""}</span>` : `<span class="res-main pts">${fmt(r.score)}</span>`;
    return `<tr class="${r.rank <= 3 ? "r" + r.rank : ""}">
      <td>${r.rank <= 3 ? `<span class="res-rank">${medal(r.rank)}</span>` : `<span class="res-rank">${r.rank}</span>`}</td>
      <td><div class="res-who"><span class="res-av" style="background:${colorFor(r.nickname)}">${esc(initials(r.nickname))}</span><span class="res-nm" title="${esc(r.nickname)}">${hl(r.nickname, q)}</span></div></td>
      ${showBar ? `<td class="c-acc">${bar}</td>` : ""}
      <td class="c-gr">${(gr => `<span class="res-gr ${gradeTone(gr)}">${gr ?? "—"}</span>`)(gradeOf(r))}</td>
      <td>${main}</td>
    </tr>`;
  };
  $("res-body").innerHTML = `<table class="res-table${acc ? "" : " m-speed"}"><thead><tr>${head}</tr></thead><tbody>${shown.map(rowHtml).join("")}</tbody></table>${list.length > shown.length ? `<button class="gh-btn res-more" data-act="res-more">Показати ще ${list.length - shown.length}</button>` : ""}`;
}

// CSV для Excel: BOM + «;» як роздільник (українська локаль Excel)
function exportCsv(g){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const acc = g.mode === "acc";
  const head = ["Місце", "Учасник", ...(g.qc ? ["Правильно", "З питань"] : acc ? ["Правильно"] : []), ...(acc && g.qc ? ["Точність, %"] : []), "Оцінка (12-бальна, за місцем)", ...(acc ? [] : ["Бали"])];
  const rows = g.results.map(r => [r.rank, r.nickname, ...(g.qc ? [r.correct ?? "", g.qc] : acc ? [r.correct ?? ""] : []), ...(acc && g.qc ? [r.correct != null ? Math.round(r.correct / g.qc * 100) : ""] : []), gradeOf(r) ?? "", ...(acc ? [] : [r.score])]);
  const csv = "﻿" + [head, ...rows].map(row => row.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const d = new Date(g.playedAt);
  a.download = `${g.title.replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60)} — ${d.toLocaleDateString("uk-UA")} (${g.code}).csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  window.toast?.("CSV завантажено");
}

$("del-confirm").addEventListener("click", async () => {
  const btn = $("del-confirm"); if (!delCode || btn.disabled) return;
  btn.disabled = true; btn.textContent = "Видаляємо…";
  try {
    await remove(ref(db, `teachers/${uid}/gameHistory/${delCode}`));
    remove(ref(db, `gameLog/${uid}/${delCode}`)).catch(() => {});   // легкий запис для адмінки
    games = games.filter(g => g.code !== delCode);
    closeM("m-gh-del");
    renderSub(); buildTestMenu();
    if (ui.test && !games.some(g => (g.testId || g.title) === ui.test)) ui.test = "";
    render();
    window.toast?.("Гру видалено з історії");
  } catch (e) { $("del-err").textContent = "Не вдалося видалити: " + e.message; }
  finally { btn.disabled = false; btn.textContent = "Видалити"; }
});

// ─── Кастомні дропдауни (.cd-*) — features.js тут не підключений ────────
function closeCd(){ document.querySelectorAll("#sec-history .cd-menu.open").forEach(m => m.classList.remove("open")); document.querySelectorAll("#sec-history .cd-btn.active").forEach(b => { b.classList.remove("active"); b.setAttribute("aria-expanded", "false"); }); }
function toggleCd(id){
  const menu = $(id + "-menu"), btn = document.querySelector(`#${id} .cd-btn`);
  const open = menu.classList.contains("open");
  closeCd();
  if (!open){ menu.classList.add("open"); btn.classList.add("active"); btn.setAttribute("aria-expanded", "true"); }
}
document.addEventListener("click", e => { if (!e.target.closest(".cd-wrap")) closeCd(); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector("#sec-history .cd-menu.open")){ const b = document.querySelector("#sec-history .cd-btn.active"); closeCd(); b?.focus(); } });

// ─── Події ─────────────────────────────────────────────────────────────
const byCode = code => games.find(g => g.code === code);
document.addEventListener("click", e => {
  const cdBtn = e.target.closest("[data-cd]");
  if (cdBtn){ toggleCd(cdBtn.dataset.cd); return; }
  const sortIt = e.target.closest("[data-sort]");
  if (sortIt){ ui.sort = sortIt.dataset.sort; ui.limit = 20; try { localStorage.setItem("qf_gh_ui", JSON.stringify({ sort: ui.sort })); } catch {} toggleCd("cd-ghsort"); render(); return; }
  const testIt = e.target.closest("[data-test]");
  if (testIt){ ui.test = testIt.dataset.test; ui.limit = 20; toggleCd("cd-ghtest"); render(); return; }
  const per = e.target.closest("[data-period]");
  if (per){ ui.period = per.dataset.period; ui.limit = 20; render(); return; }
  const md = e.target.closest("#mode [data-mode]");
  if (md){ ui.mode = md.dataset.mode; ui.limit = 20; render(); return; }
  const qlb = e.target.closest("[data-ql]");
  if (qlb){ qlAction(qlb); return; }
  const el = e.target.closest("[data-act]");
  if (!el || !el.dataset.act){ if (!e.target.closest(".gh-menu")) closeMenu(); return; }
  const g = byCode(el.dataset.code);
  switch (el.dataset.act){
    case "open":   closeMenu(); if (g) openResults(g); break;
    case "menu":   if (menuFor === el) closeMenu(); else if (g) openMenu(el, g); break;
    case "csv":    closeMenu(); if (g && (!window.qfCan || window.qfCan("export"))) exportCsv(g); break;
    case "replay": closeMenu(); if (g?.testId && (!window.qfCan || window.qfCan("games.run"))) location.href = `live/setup?testId=${encodeURIComponent(g.testId)}`; break;
    case "del":    closeMenu(); if (g) askDelete(g); break;
    case "more":   ui.limit += 20; render(); break;
    case "res-more": resLimit += 200; renderResults(); break;
    case "reset":  ui.q = ""; ui.period = "all"; ui.mode = "all"; ui.test = ""; $("search-inp").value = ""; render(); break;
    case "quick":  openQuickLaunch(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".gh-menu")){ const b = menuFor; closeMenu(); b?.focus(); }
  if (e.key === "/" && !e.target.closest("input,textarea") && !document.querySelector(".mo.on")){ e.preventDefault(); $("search-inp").focus(); }
});
document.addEventListener("scroll", closeMenu, true);
window.addEventListener("resize", closeMenu);
let searchTimer;
$("search-inp").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { ui.q = e.target.value.trim(); ui.limit = 20; render(); }, 120); });

// ─── Швидкий запуск гри ────────────────────────────────────────────────
// Сторінка вантажиться з { skipData:true } — тести/папки тягнемо лише при першому відкритті.
let qlTests = null, qlFolders = null, qlFolder = null;   // null = список папок
async function openQuickLaunch(){
  qlFolder = null; $("ql-search").value = "";
  openM("m-ql");
  if (qlTests === null){
    $("ql-list").innerHTML = `<div class="ql-empty">Завантаження тестів…</div>`;
    try {
      const [fs, ts] = await Promise.all([window.dbGet("folders"), window.dbGet("tests")]);
      qlFolders = window.toArr(fs);
      qlTests = window.toArr(ts).filter(t => t.status !== "archived" && (t.questions || []).length > 0);
    } catch (e) { qlTests = null; $("ql-list").innerHTML = `<div class="ql-empty">Не вдалося завантажити тести: ${esc(e.message)}</div>`; return; }
  }
  renderQl();
}
function renderQl(){
  const q = $("ql-search").value.trim().toLowerCase();
  const list = $("ql-list");
  // Пошук шукає тести одразу в усіх папках
  if (qlFolder === null && !q){
    $("ql-back").hidden = true;
    const cnt = fid => qlTests.filter(t => (t.folderId && qlFolders.some(f => f.id === t.folderId) ? t.folderId : "_none") === fid).length;
    const rows = [{ id: "_all", name: "Усі тести", color: "#2563EB", n: qlTests.length },
      ...qlFolders.map(f => ({ id: f.id, name: f.name || "Без назви", color: f.color || "#94A3B8", n: cnt(f.id) })).filter(r => r.n),
      { id: "_none", name: "Без папки", color: "#94A3B8", n: cnt("_none") }].filter(r => r.n);
    list.innerHTML = rows.length ? rows.map(r => `<button class="ql-row" data-ql="folder" data-id="${esc(r.id)}"><span class="dot" style="background:${r.color}"></span><span class="t">${esc(r.name)}</span><span class="m">${r.n} ${plural(r.n, "тест", "тести", "тестів")}</span></button>`).join("")
      : `<div class="ql-empty">Немає тестів з питаннями — створіть тест у розділі «Тести»</div>`;
    return;
  }
  let tests = qlTests;
  if (qlFolder && qlFolder !== "_all") tests = tests.filter(t => qlFolder === "_none" ? !(t.folderId && qlFolders.some(f => f.id === t.folderId)) : t.folderId === qlFolder);
  if (q) tests = tests.filter(t => (t.title || "").toLowerCase().includes(q));
  $("ql-back").hidden = qlFolder === null;
  $("ql-back-lbl").textContent = qlFolder === "_all" ? "Усі тести" : qlFolder === "_none" ? "Без папки" : (qlFolders.find(f => f.id === qlFolder)?.name || "");
  list.innerHTML = tests.length ? tests.map(t => `<button class="ql-row" data-ql="test" data-id="${esc(t.id)}">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
      <span class="t">${esc(t.title || "Без назви")}</span><span class="m">${(t.questions || []).length} пит.</span><span class="go">Запустити →</span></button>`).join("")
    : `<div class="ql-empty">Нічого не знайдено</div>`;
}
function qlAction(el){
  const a = el.dataset.ql;
  if (a === "back"){ qlFolder = null; $("ql-search").value = ""; renderQl(); $("ql-search").focus(); }
  else if (a === "folder"){ qlFolder = el.dataset.id; $("ql-search").value = ""; renderQl(); $("ql-search").focus(); }
  else if (a === "test" && (!window.qfCan || window.qfCan("games.run"))) location.href = `live/setup?testId=${encodeURIComponent(el.dataset.id)}`;
}
$("ql-search").addEventListener("input", () => qlTests && renderQl());
</script>
