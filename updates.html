<style>
#sec-updates{
  --ink-900:var(--qf-ink-900); --ink-700:var(--qf-ink-700); --ink-500:var(--qf-ink-500); --ink-400:var(--qf-ink-400);
  --line:var(--qf-line); --line-strong:var(--qf-line-strong);
  --c-new:#2563EB; --c-better:#0F9D8A; --c-fix:#C27A0E;
  font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:var(--ink-900);
}
#sec-updates .up-wrap{max-width:none}
#sec-updates .up-head p{margin:0;color:var(--ink-500);font-size:14px;line-height:1.5}
#sec-updates .up-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
#sec-updates .up-chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:700;color:var(--ink-700);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
#sec-updates .up-chip:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-updates .up-chip.on{background:var(--qf-primary-soft);border-color:#BFD3FF;color:var(--qf-primary-dark)}
#sec-updates .up-chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-400))}
#sec-updates .up-chip em{font-style:normal;font-family:"Geist Mono",monospace;font-size:12px;color:var(--ink-400)}
#sec-updates .up-chip:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
#sec-updates .up-month{display:flex;align-items:center;gap:12px;margin:22px 0 6px;font-size:13px;font-weight:800;color:var(--ink-400);text-transform:capitalize}
#sec-updates .up-month::after{content:"";flex:1;height:1px;background:var(--line)}
#sec-updates .up-rel{padding:10px 0 20px}
#sec-updates .up-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#sec-updates .up-t{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
#sec-updates .up-d{font-family:"Geist Mono",monospace;font-size:12px;color:var(--ink-400)}
#sec-updates .up-last{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--c-new)}
#sec-updates .up-last::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-new);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
#sec-updates .up-lead{margin:4px 0 6px;font-size:15px;line-height:1.6;color:var(--ink-500);max-width:62ch}
#sec-updates .up-it{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:10px 0}
#sec-updates .up-pill{height:26px;align-self:start;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:12.5px;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
#sec-updates .up-it h4{margin:0;font-size:16px;font-weight:700;line-height:1.4;color:var(--ink-900)}
#sec-updates .up-it p{margin:3px 0 0;font-size:15px;line-height:1.6;color:var(--ink-700);max-width:62ch}
#sec-updates .up-empty{padding:48px 20px;text-align:center;color:var(--ink-500);font-size:14px;background:#fff;border:1px dashed var(--line-strong);border-radius:18px;margin-top:16px}
@media (max-width:640px){
  #sec-updates .up-it{grid-template-columns:minmax(0,1fr);gap:6px}
  #sec-updates .up-pill{justify-self:start;padding:0 12px}
  #sec-updates .up-chip{height:44px}
}
@media (prefers-reduced-motion:reduce){#sec-updates *{transition:none!important}}
</style>
</head>
<body>

<div id="app-loader" style="position:fixed;inset:0;background:#f0f3fa;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease">
  <div style="width:44px;height:44px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:appSpin .8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;margin-top:12px;font-family:'Manrope',sans-serif">Завантаження...</div>
</div>
<style>@keyframes appSpin{to{transform:rotate(360deg)}}</style>

<script src="shared/nav.js?v=37"></script>
<main class="main">
  <div class="sec on" id="sec-updates">
    <div class="up-wrap">
      <div class="up-head">
        <h1>Оновлення</h1>
        <p>Що ми змінили в QuizFlow: нові можливості, покращення й виправлення.</p>
      </div>
      <div class="up-bar" id="up-bar" role="group" aria-label="Фільтр за типом"></div>
      <div class="up-list" id="up-list" aria-live="polite"></div>
    </div>
  </div>
</main>

<div id="modals-root"></div>

<script type="module">
const { initApp, esc } = await import("./shared/app.js?v=49");
const featuresP = import("./shared/features.js?v=62");
const { CHANGELOG } = await import("./shared/changelog.js?v=1");

const TYPES = { new: ["Нове", "var(--c-new)"], better: ["Покращено", "var(--c-better)"], fix: ["Виправлено", "var(--c-fix)"] };
const MON = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
let filter = "all";

function counts(){
  const c = { all: 0, new: 0, better: 0, fix: 0 };
  for (const r of CHANGELOG) for (const i of r.items){ c.all++; c[i.t]++; }
  return c;
}
function renderBar(){
  const c = counts();
  const chips = [["all", "Усе", ""], ...Object.entries(TYPES).map(([k, [l, col]]) => [k, l, col])];
  document.getElementById("up-bar").innerHTML = chips.map(([k, l, col]) =>
    `<button type="button" class="up-chip${filter === k ? " on" : ""}" data-f="${k}" aria-pressed="${filter === k}">${col ? `<i style="--c:${col}"></i>` : ""}${esc(l)}<em>${c[k]}</em></button>`).join("");
}
const MON_NOM = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
function renderList(){
  const rels = CHANGELOG.map(r => ({ ...r, items: r.items.filter(i => filter === "all" || i.t === filter) })).filter(r => r.items.length);
  const el = document.getElementById("up-list");
  if (!rels.length){ el.innerHTML = '<div class="up-empty">Нічого не знайдено</div>'; return; }
  let cur = "";
  el.innerHTML = rels.map((r, n) => {
    const [y, m, d] = r.date.split("-").map(Number);
    const key = r.date.slice(0, 7);
    const head = key !== cur ? `<h2 class="up-month">${MON_NOM[m - 1]} ${y}</h2>` : "";
    cur = key;
    return `${head}<article class="up-rel">
      <div class="up-h"><h3 class="up-t">${esc(r.title)}</h3><span class="up-d">${d} ${MON[m - 1]} ${y}</span>${n === 0 && filter === "all" ? '<span class="up-last">Останнє оновлення</span>' : ""}</div>
      ${r.lead ? `<p class="up-lead">${esc(r.lead)}</p>` : ""}
      ${r.items.map(i => `<div class="up-it" style="--c:${TYPES[i.t][1]}"><span class="up-pill">${TYPES[i.t][0]}</span><div><h4>${esc(i.h)}</h4>${i.d ? `<p>${esc(i.d)}</p>` : ""}</div></div>`).join("")}
    </article>`;
  }).join("");
}
document.getElementById("up-bar").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f; renderBar(); renderList();
});
renderBar(); renderList();

window.showSec = function(name){
  const map = { dashboard:"./", tests:"tests", attempts:"attempts", links:"links", analytics:"analytics", gradebook:"gradebook", students:"students", notifications:"notifications", suspicious:"suspicious", online:"online", news:"news", updates:"updates" };
  if (name !== "updates" && map[name]) location.href = map[name];
};

await initApp("updates");
await featuresP;
await window.initFeatures();
requestAnimationFrame(() => requestAnimationFrame(() => { if (window.appReady) window.appReady(); }));
</script>
</body>
</html>
